    <script>
        // --- ESTADO GLOBAL & INDEXEDDB ---
        const DB_NAME = 'SoulAtelierDB';
        const STORE_NAME = 'atelier_store';
        const STATE_KEY = 'main_state';

        const state = {
            currentView: 'home',
            config: { artisanName: 'William', atelierName: 'SOUL', avatar: '', imgPosX: 50, imgPosY: 50 },
            pedidos: [],
            estoque: [],
            receitas: [],
            custos: [],
            financeiro: [],
            produtos: [],
            insights: [],
            formState: { type: null, editingId: null, tempImage: null, tempImagesMultiple: [], tempImgPosX: 50, tempImgPosY: 50, tempPartes: [] },
            currentRecipeViewId: null,
            currentOrderId: null,
            currentStockId: null,
            currentProductViewId: null,
            currentInsightFolderId: null,
            insightSelectionMode: false,
            insightSelectedIds: []
        };

        let activeFolderPhotos = [];

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
            });
        }

        async function saveStateToIDB() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put(JSON.parse(JSON.stringify(state)), STATE_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                console.error("Erro ao salvar no IndexedDB:", e);
            }
        }

        async function loadStateFromIDB() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(STATE_KEY);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                return null;
            }
        }

        async function saveState() {
            await saveStateToIDB();
        }

        async function loadState() {
            let parsed = await loadStateFromIDB();
            if (!parsed) {
                const keysToTry = ['soul_atelier_data_v15', 'soul_atelier_data_v14', 'soul_atelier_data_v13', 'soul_atelier_data_v12', 'soul_atelier_data_v11', 'soul_atelier_data_v10', 'soul_atelier_data_v9', 'soul_atelier_data_v8', 'soul_atelier_data_v7', 'soul_atelier_data_v6', 'soul_atelier_data_v5', 'soul_atelier_data_v4', 'soul_atelier_data_v3'];
                for (const k of keysToTry) {
                    const saved = localStorage.getItem(k);
                    if (saved) {
                        try {
                            parsed = JSON.parse(saved);
                            break;
                        } catch(e) {}
                    }
                }
            }

            if (parsed) {
                if (parsed.config) state.config = { ...state.config, ...parsed.config };
                if (parsed.pedidos) state.pedidos = parsed.pedidos;
                if (parsed.estoque) state.estoque = parsed.estoque.filter(e => parseFloat(e.qtd || 0) > 0);
                if (parsed.receitas) state.receitas = parsed.receitas;
                if (parsed.custos) state.custos = parsed.custos;
                if (parsed.financeiro) state.financeiro = parsed.financeiro;
                if (parsed.produtos) state.produtos = parsed.produtos;
                if (parsed.insights) state.insights = parsed.insights;
            }
            if(!state.insights) state.insights = [];
            await saveStateToIDB();
        }

        // --- VISUALIZADOR DE IMAGEM EM TELA CHEIA ---
        let activeGalleryImages = [];
        let activeGalleryIndex = 0;

        function openFullscreenImg(src, title = 'soul_foto') {
            activeGalleryImages = [{ conteudo: src, titulo: title }];
            activeGalleryIndex = 0;
            renderFullscreenGallery();
            document.getElementById('overlay-fullscreen-img').classList.remove('hidden');
        }

        function openFolderGallery(startIndex) {
            activeGalleryImages = activeFolderPhotos;
            activeGalleryIndex = startIndex;
            renderFullscreenGallery();
            document.getElementById('overlay-fullscreen-img').classList.remove('hidden');
        }

        function renderFullscreenGallery() {
            if (activeGalleryImages.length === 0) return;
            const item = activeGalleryImages[activeGalleryIndex];
            const img = document.getElementById('fullscreen-img-src');
            const titleEl = document.getElementById('fullscreen-title');
            const counterEl = document.getElementById('fullscreen-counter');
            const prevBtn = document.getElementById('btn-prev-img');
            const nextBtn = document.getElementById('btn-next-img');

            img.src = item.conteudo;
            titleEl.innerText = item.titulo || '';
            counterEl.innerText = `${activeGalleryIndex + 1} / ${activeGalleryImages.length}`;

            if (activeGalleryImages.length > 1) {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
            lucide.createIcons();
        }

        function changeGalleryImage(direction) {
            if (activeGalleryImages.length <= 1) return;
            activeGalleryIndex += direction;
            if (activeGalleryIndex < 0) activeGalleryIndex = activeGalleryImages.length - 1;
            if (activeGalleryIndex >= activeGalleryImages.length) activeGalleryIndex = 0;
            renderFullscreenGallery();
        }

        function closeFullscreenImg() {
            document.getElementById('overlay-fullscreen-img').classList.add('hidden');
        }

        function downloadCurrentPhoto() {
            const item = activeGalleryImages[activeGalleryIndex];
            if (!item || !item.conteudo) return;
            try {
                const arr = item.conteudo.split(',');
                const mime = arr[0].match(/:(.*?);/)[1];
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while(n--) { u8arr[n] = bstr.charCodeAt(n); }
                const blob = new Blob([u8arr], {type: mime});
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(item.titulo || 'soul_foto').toLowerCase().replace(/\s+/g, '_')}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch(e) {
                const a = document.createElement('a');
                a.href = item.conteudo;
                a.download = 'soul_foto.jpg';
                a.click();
            }
        }

        // --- SWIPE GESTURE ---
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const swipeArea = document.getElementById('fullscreen-swipe-area');
            if (swipeArea) {
                swipeArea.addEventListener('touchstart', e => {
                    touchStartX = e.changedTouches[0].screenX;
                }, {passive: true});

                swipeArea.addEventListener('touchend', e => {
                    touchEndX = e.changedTouches[0].screenX;
                    handleSwipeGesture();
                }, {passive: true});
            }
        });

        function handleSwipeGesture() {
            const minSwipeDistance = 50;
            if (touchEndX < touchStartX - minSwipeDistance) changeGalleryImage(1);
            if (touchEndX > touchStartX + minSwipeDistance) changeGalleryImage(-1);
        }

        // --- DRAG IMAGEM FORM ---
        let dragData = { isDragging: false, startX: 0, startY: 0, initialX: 50, initialY: 50, el: null };

        function initImageDrag(imgId) {
            const imgEl = document.getElementById(imgId);
            if(!imgEl) return;
            imgEl.addEventListener('mousedown', startImageDrag);
            imgEl.addEventListener('touchstart', startImageDrag, {passive: false});
        }

        function startImageDrag(e) {
            e.preventDefault();
            dragData.isDragging = true;
            dragData.el = e.target;
            dragData.startX = e.touches ? e.touches[0].clientX : e.clientX;
            dragData.startY = e.touches ? e.touches[0].clientY : e.clientY;
            dragData.initialX = state.formState.tempImgPosX || 50;
            dragData.initialY = state.formState.tempImgPosY || 50;
            
            document.addEventListener('mousemove', onImageDrag);
            document.addEventListener('touchmove', onImageDrag, {passive: false});
            document.addEventListener('mouseup', stopImageDrag);
            document.addEventListener('touchend', stopImageDrag);
        }

        function onImageDrag(e) {
            if (!dragData.isDragging || !dragData.el) return;
            e.preventDefault();
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = dragData.startX - currentX; 
            const dy = dragData.startY - currentY;
            let newX = dragData.initialX + (dx * 0.4); 
            let newY = dragData.initialY + (dy * 0.4);
            newX = Math.max(0, Math.min(100, newX));
            newY = Math.max(0, Math.min(100, newY));
            state.formState.tempImgPosX = newX;
            state.formState.tempImgPosY = newY;
            dragData.el.style.objectPosition = `${newX}% ${newY}%`;

            dragData.isDragging = false; dragData.el = null;

        function dragEnter(ev) { ev.preventDefault(); ev.currentTarget.classList.add('border-brand', 'bg-brand-light/20', 'scale-[1.01]'); }
        function dragLeave(ev) { ev.currentTarget.classList.remove('border-brand', 'bg-brand-light/20', 'scale-[1.01]'); }
        async function drop(ev, targetIndex, arrayName) {
            ev.preventDefault();
            document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('border-brand', 'bg-brand-light/20', 'scale-[1.01]'));
            if (draggedData.arrayName !== arrayName || draggedData.index === null || draggedData.index === targetIndex) return;
            const arr = state[arrayName];
            const item = arr.splice(draggedData.index, 1)[0];
            arr.splice(targetIndex, 0, item);
            draggedData = { index: null, arrayName: null };
            await saveState();
            render();
        }

            financeiro: () => {
                let entradasTotais = state.pedidos.filter(p => p.status === 'Entregue').reduce((acc, p) => acc + Number(p.valor || 0), 0);
                let saidasTotais = state.financeiro.reduce((acc, t) => acc + Number(t.valor || 0), 0);
                let saldoLiquido = entradasTotais - saidasTotais;

                return `
                <div class="px-5 space-y-6 fade-in pt-2">
                    <div class="flex justify-between items-center">
                        <h2 class="font-heading text-2xl font-bold text-stone-900">Despesas & Caixa</h2>
                        <button onclick="openForm('financeiro')" class="bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold active:scale-95 transition-transform flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-4 h-4 pointer-events-none"></i> Despesa</button>

                            <span class="text-xs font-medium text-stone-500"><i data-lucide="trending-down" class="inline w-3 h-3 text-red-500 mr-1 pointer-events-none"></i>Despesas</span>

                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-end mb-4"><h3 class="font-bold">Registro de Despesas</h3></div>

                        ${state.financeiro.map((t, index) => `
                            <div draggable="true" ondragstart="drag(event, ${index}, 'financeiro')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ${index}, 'financeiro')" class="drag-target flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm mb-3 border border-stone-100 gap-3 cursor-grab active:cursor-grabbing transition-all">

        function generateListHTML(title, arrayName, actionName, renderItem) {
            const array = state[arrayName];
            return `
                <div class="px-5 space-y-4 fade-in pt-2">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="font-heading text-2xl font-bold text-stone-900">${title}</h2>
                        <button onclick="openForm('${actionName}')" class="bg-brand text-white px-4 py-2 rounded-xl text-xs font-bold active:scale-95 transition-transform flex items-center gap-1 shadow-sm">
                            <i data-lucide="plus" class="w-4 h-4 pointer-events-none"></i> Novo
                        </button>
                    </div>
                    ${array.length === 0 ? `<p class="text-center text-sm text-stone-400 py-10">Nenhum item cadastrado.</p>` : ''}
                    ${array.map((item, index) => `
                        <div draggable="true" ondragstart="drag(event, ${index}, '${arrayName}')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ${index}, '${arrayName}')" class="drag-target bg-white rounded-2xl p-4 border border-stone-100 shadow-sm flex items-center gap-3 cursor-grab active:cursor-grabbing transition-all hover:shadow-md">
                            <div class="flex items-center justify-center shrink-0 pr-1 text-stone-300"><i data-lucide="grip-vertical" class="w-5 h-5 pointer-events-none"></i></div>
                            <div class="flex-1 min-w-0">${renderItem(item, index)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function render() {
            const contentDiv = document.getElementById('app-content');
            if(contentDiv) {
                contentDiv.innerHTML = views[state.currentView]();
                updateHeader();
                const activeTarget = state.currentView.startsWith('insight') ? 'home' : state.currentView;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const isActive = btn.dataset.target === activeTarget;
                    btn.classList.toggle('text-brand', isActive);
                    btn.classList.toggle('text-stone-400', !isActive);
                });
                lucide.createIcons();
            }
        }

        function updateHeader() {
            document.getElementById('header-atelier').innerText = state.config.atelierName || 'SOUL';
            document.getElementById('header-artesao').innerText = state.config.artisanName || 'Artesão';
            if (state.config.avatar) {
                const avatarEl = document.getElementById('header-avatar');
                avatarEl.src = state.config.avatar;
                avatarEl.style.objectPosition = `${state.config.imgPosX||50}% ${state.config.imgPosY||50}%`;
            }
        }

        function navigate(view) { 
            state.currentView = view; 
            state.insightSelectionMode = false;
            state.insightSelectedIds = [];
            closeAllModals(); 
            render(); 
        }
        function openInsightFolder(id) { 
            state.currentInsightFolderId = id; 
            state.insightSelectionMode = false;
            state.insightSelectedIds = [];
            navigate('insight_folder'); 
        }

        // --- DEFINIÇÃO DOS FORMULÁRIOS COM BOTÕES SIMPLIFICADOS ---
        const formDefinitions = {
            perfil: { title: 'Editar Perfil', fields: [ { id: 'f-art', label: 'Nome do Artesão', type: 'text', key: 'artisanName' }, { id: 'f-ate', label: 'Nome do Ateliê', type: 'text', key: 'atelierName' }, { id: 'f-img', label: 'Foto de Perfil', type: 'file', key: 'avatar' } ] },
            produto: { title: 'Produto', fields: [ { id: 'f-nome', label: 'Nome da Peça / Produto', type: 'text', key: 'nome' }, { id: 'f-preco', label: 'Preço de Venda (R$)', type: 'number', key: 'preco' }, { id: 'f-tamanho', label: 'Tamanho / Medidas', type: 'text', key: 'tamanho' }, { id: 'f-partes', label: 'Partes e Materiais', type: 'dynamic_parts', key: 'partes' }, { id: 'f-img', label: 'Foto do Produto', type: 'file', key: 'img' } ] },
            pedido: { title: 'Pedido', fields: [ { id: 'f-cli', label: 'Nome do Cliente', type: 'text', key: 'cliente' }, { id: 'f-status', label: 'Status', type: 'select', options: ['Pendente', 'Em Produção', 'Entregue'], key: 'status' }, { id: 'f-dataEntrega', label: 'Data de Entrega Prevista', type: 'date', key: 'dataEntrega' }, { id: 'f-venderEstoque', label: 'Vender item do estoque?', type: 'checkbox', key: 'venderEstoque' }, { id: 'f-item', label: 'Selecionar Produto', type: 'product_select', key: 'item' }, { id: 'f-qtd', label: 'Quantidade', type: 'number', key: 'qtd' }, { id: 'f-obs', label: 'Observações', type: 'textarea', key: 'obs' } ] },
            estoque: { title: 'Item de Estoque', fields: [ { id: 'f-item', label: 'Selecionar Produto', type: 'product_select_all', key: 'item' }, { id: 'f-qtd', label: 'Quantidade (0 para apagar)', type: 'number', key: 'qtd' }, { id: 'f-obs', label: 'Observações', type: 'textarea', key: 'obs' } ] },
            receita: { title: 'Receita', fields: [ { id: 'f-nome', label: 'Nome da Peça', type: 'text', key: 'nome' }, { id: 'f-fio', label: 'Fio Utilizado', type: 'text', key: 'fio' }, { id: 'f-agulha', label: 'Agulha(s)', type: 'text', key: 'agulha' }, { id: 'f-desc', label: 'Passo a passo / Anotações', type: 'textarea', key: 'desc' }, { id: 'f-img', label: 'Foto da Peça Final', type: 'file', key: 'img' } ] },
            financeiro: { title: 'Despesa', fields: [ { id: 'f-cat', label: 'Categoria', type: 'select', options: ['Matéria-prima', 'Embalagens', 'Ferramentas', 'Frete', 'Outros'], key: 'categoria' }, { id: 'f-desc', label: 'Descrição da Despesa', type: 'text', key: 'desc' }, { id: 'f-valor', label: 'Valor (R$)', type: 'number', key: 'valor' }, { id: 'f-data', label: 'Data', type: 'date', key: 'data' } ] },
            custo: { title: 'Calculadora de Custos', fields: [ { id: 'c-nome', label: 'Nome da Peça', type: 'text', key: 'nome' }, { id: 'c-precoRolo', label: 'Preço no Rolo (R$)', type: 'number', key: 'precoRolo' }, { id: 'c-pesoRolo', label: 'Peso Total Rolo (g)', type: 'number', key: 'pesoRolo' }, { id: 'c-pesoGasto', label: 'Peso Gasto na Peça (g)', type: 'number', key: 'pesoGasto' }, { id: 'c-extras', label: 'Custos Extras (Caixa) (R$)', type: 'number', key: 'extras' }, { id: 'c-horas', label: 'Tempo de Trabalho (h)', type: 'number', key: 'horas' }, { id: 'c-valorHora', label: 'Valor da Hora (R$)', type: 'number', key: 'valorHora' } ] },
            pasta_insight: { title: 'Pasta de Ideias', fields: [ { id: 'f-nome', label: 'Nome da Pasta', type: 'text', key: 'nome' } ] },
            insight_link: { title: 'Salvar Link', fields: [ { id: 'f-titulo', label: 'Título / Descrição', type: 'text', key: 'titulo' }, { id: 'f-conteudo', label: 'URL / Link', type: 'text', key: 'conteudo' } ] },
            insight_image: { title: 'Salvar Fotos', fields: [ { id: 'f-img', label: 'Salvar Foto', type: 'multiple_files', key: 'conteudo' } ] }
        };

        function openCustomSelect(inputId, type) {
            let availableProducts = state.produtos;
            const checkboxEl = document.getElementById('f-venderEstoque');
            const onlyStock = checkboxEl ? checkboxEl.checked : false;
            if (onlyStock && type === 'product_select') {
                const stockProductNames = state.estoque.filter(e => parseFloat(e.qtd || 0) > 0).map(e => e.item);
                availableProducts = state.produtos.filter(p => stockProductNames.includes(p.nome));
            }
            let html = '';
            if (availableProducts.length === 0) { html = `<p class="text-sm text-stone-400 text-center py-6">Nenhum produto disponível.</p>`; } 
            else {
                html = availableProducts.map(p => `
                    <div onclick="selectOption('${inputId}', '${p.nome}', '${p.nome}', ${Number(p.preco||0)})" class="p-4 bg-stone-50 rounded-xl border border-stone-100 active:bg-stone-200 transition-colors cursor-pointer flex justify-between items-center shadow-sm">
                        <span class="font-bold text-sm text-stone-800">${p.nome}</span>
                        <span class="text-xs font-semibold text-brand bg-brand-light px-2 py-1 rounded">R$ ${Number(p.preco||0).toFixed(2).replace('.',',')}</span>
                    </div>
                `).join('');
            }
            document.getElementById('custom-select-list').innerHTML = html;
            document.getElementById('overlay-custom-select').classList.remove('hidden');
        }
        function selectOption(inputId, value, name, price) {
            document.getElementById(inputId).value = value;
            document.getElementById(inputId + '-display').innerHTML = `<span class="text-stone-900 font-bold">${name} <span class="font-normal text-stone-500 text-xs ml-1">(R$ ${price.toFixed(2).replace('.',',')})</span></span><i data-lucide="chevron-down" class="w-4 h-4 text-stone-400"></i>`;
            lucide.createIcons(); closeCustomSelect();
        }
        function closeCustomSelect() { document.getElementById('overlay-custom-select').classList.add('hidden'); }

        function openForm(type, id = null) {
            closeAllModals();
            state.formState = { type, editingId: id, tempImage: null, tempImagesMultiple: [], tempImgPosX: 50, tempImgPosY: 50, tempPartes: [] };
            const def = formDefinitions[type];
            document.getElementById('form-title').innerText = id ? 'Editar ' + def.title : (['perfil'].includes(type) ? def.title : 'Novo(a) ' + def.title);

            let item = {};
            if (type === 'perfil') item = state.config;
            else if (['insight_link', 'insight_image'].includes(type)) {
                const folder = state.insights.find(f => f.id === state.currentInsightFolderId);
                item = (folder?.items || []).find(i => i.id === id);
            }
            else if (type === 'pasta_insight') item = state.insights.find(i => i.id === id);
            else if (id) {
                const arr = type === 'financeiro' ? state.financeiro : (type === 'produto' ? state.produtos : (type === 'estoque' ? state.estoque : state[type + 's']));
                item = arr.find(i => i.id === id);
            }

            let html = '';
            def.fields.forEach(f => {
                let val = item && item[f.key] !== undefined ? item[f.key] : '';
                if (f.key === 'data' && !val) val = new Date().toISOString().split('T')[0];
                if (f.key === 'qtd' && !val && (type === 'pedido' || type === 'estoque')) val = 1;

                if (f.type === 'dynamic_parts') {
                    html += `
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-stone-500 mb-2">${f.label}</label>
                            <div id="dynamic-parts-container"></div>
                            <button type="button" onclick="addDynamicPart()" class="w-full py-3 mt-1 border-2 border-dashed border-stone-200 text-stone-500 font-bold text-xs rounded-xl hover:bg-stone-50 active:scale-95 transition-all flex items-center justify-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Material
                            </button>
                        </div>
                    `;
                    return;
                }

                html += `<div class="mb-4"><label class="block text-xs font-bold text-stone-500 mb-1">${f.label}</label>`;

                if (f.type === 'textarea') {
                    html += `<textarea id="${f.id}" rows="3" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm shadow-inner">${val}</textarea>`;
                } else if (f.type === 'select') {
                    html += `<select id="${f.id}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm shadow-inner">${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
                } else if (f.type === 'product_select' || f.type === 'product_select_all') {
                    let displayVal = val ? `<span class="text-stone-900 font-bold">${val}</span>` : '<span class="text-stone-400">Selecione um produto...</span>';
                    html += `
                    <div class="relative cursor-pointer" onclick="openCustomSelect('${f.id}', '${f.type}')">
                        <input type="hidden" id="${f.id}" value="${val}">
                        <div id="${f.id}-display" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none flex justify-between items-center text-sm shadow-inner">
                            ${displayVal} <i data-lucide="chevron-down" class="w-4 h-4 text-stone-400"></i>
                        </div>
                    </div>`;
                } else if (f.type === 'checkbox') {
                    html += `<input type="checkbox" id="${f.id}" ${val ? 'checked' : ''} class="w-5 h-5 accent-brand rounded border-stone-300">`;
                } else if (f.type === 'multiple_files') {
                    html += `
                        <div class="flex flex-col gap-2">
                            <div id="multiple-preview-container" class="grid grid-cols-3 gap-2 ${val ? '' : 'hidden'}"></div>
                            <label class="bg-stone-50 border border-stone-200 text-stone-600 font-bold text-xs py-4 rounded-xl flex justify-center items-center gap-2 cursor-pointer active:scale-95 transition-transform hover:bg-stone-100">
                                <i data-lucide="upload" class="w-4 h-4"></i> Salvar Foto
                                <input type="file" accept="image/*" multiple onchange="handleMultipleImagesUpload(event)" class="hidden">
                            </label>
                        </div>
                    `;
                } else if (f.type === 'file') {
                    let posX = item && item.imgPosX !== undefined ? item.imgPosX : 50;
                    let posY = item && item.imgPosY !== undefined ? item.imgPosY : 50;
                    state.formState.tempImgPosX = posX; state.formState.tempImgPosY = posY;
                    
                    html += `
                        <div class="flex flex-col gap-2">
                            <div id="${f.id}-preview-container" class="relative w-full h-32 bg-stone-100 rounded-xl overflow-hidden border border-stone-200 shadow-inner group ${val ? '' : 'hidden'}">
                                <img id="${f.id}-preview" src="${val || ''}" style="object-position: ${posX}% ${posY}%;" class="w-full h-full object-cover cursor-move">
                                <div class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                                    <i data-lucide="move" class="text-white w-6 h-6 mb-1"></i>
                                    <span class="text-white text-[10px] font-bold">Arraste para ajustar</span>
                                </div>
                            </div>
                            <label class="bg-stone-50 border border-stone-200 text-stone-600 font-bold text-xs py-3 rounded-xl flex justify-center items-center gap-2 cursor-pointer active:scale-95 transition-transform hover:bg-stone-100">
                                <i data-lucide="upload" class="w-4 h-4"></i> ${val ? 'Trocar Foto' : 'Salvar Foto'}
                                <input type="file" accept="image/*" onchange="handleImageUpload(event, '${f.id}-preview', '${f.id}-preview-container')" class="hidden">
                            </label>
                        </div>
                    `;
                    if (val) { state.formState.tempImage = val; setTimeout(() => initImageDrag(`${f.id}-preview`), 50); }
                } else {
                    html += `<input type="${f.type}" id="${f.id}" value="${val}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm shadow-inner">`;
                }
                html += `</div>`;
            });

            document.getElementById('form-body').innerHTML = html;
            document.getElementById('btn-delete').classList.toggle('hidden', !id);

            if (type === 'produto') {
                state.formState.tempPartes = (item && item.partes && item.partes.length > 0) ? JSON.parse(JSON.stringify(item.partes)) : [{ material: '', peso: '' }];
                renderDynamicParts();
            }

            if (type === 'pedido') {
                const cb = document.getElementById('f-venderEstoque');
                if (cb) { cb.addEventListener('change', () => { document.getElementById('f-item').value = ''; document.getElementById('f-item-display').innerHTML = `<span class="text-stone-400">Selecione um produto...</span><i data-lucide="chevron-down" class="w-4 h-4 text-stone-400"></i>`; lucide.createIcons(); }); }
            }

            document.getElementById('overlay-form').classList.remove('hidden');
        }

        function closeFormModal() { document.getElementById('overlay-form').classList.add('hidden'); }

        function handleMultipleImagesUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            state.formState.tempImagesMultiple = [];
            const container = document.getElementById('multiple-preview-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            Array.from(files).forEach((file) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const originalDataUrl = e.target.result;
                    state.formState.tempImagesMultiple.push(originalDataUrl);
                    container.innerHTML += `
                        <div class="h-24 rounded-xl overflow-hidden border border-stone-200 relative bg-stone-100">
                            <img src="${originalDataUrl}" class="w-full h-full object-cover">
                        </div>
                    `;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleImageUpload(event, previewId, containerId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const originalDataUrl = e.target.result;
                    const previewEl = document.getElementById(previewId);
                    previewEl.src = originalDataUrl;
                    state.formState.tempImgPosX = 50; state.formState.tempImgPosY = 50;
                    previewEl.style.objectPosition = '50% 50%';
                    document.getElementById(containerId).classList.remove('hidden');
                    state.formState.tempImage = originalDataUrl;
                    setTimeout(() => initImageDrag(previewId), 50);
                };
                reader.readAsDataURL(file);
            }
        }

        function openRecipeDetail(id) {
            closeAllModals(); state.currentRecipeViewId = id; const r = state.receitas.find(item => item.id === id); if (!r) return;
            document.getElementById('recipe-detail-body').innerHTML = `
                ${r.img ? `<img src="${r.img}" style="object-position: ${r.imgPosX||50}% ${r.imgPosY||50}%;" class="w-full h-48 rounded-2xl object-cover border border-stone-200 shadow-sm cursor-pointer hover:opacity-95 transition-opacity" onclick="openFullscreenImg('${r.img}', '${r.nome}')">` : ''}
                <div><h2 class="text-xl font-bold text-stone-900 mb-2">${r.nome}</h2><div class="flex gap-2 text-xs text-stone-600 mb-4"><span class="bg-stone-100 px-3 py-1.5 rounded-xl">Fio: <b>${r.fio}</b></span><span class="bg-stone-100 px-3 py-1.5 rounded-xl">Agulha: <b>${r.agulha}</b></span></div></div>
                <div><h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Passo a passo</h4><div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${r.desc || 'Nenhum passo a passo cadastrado.'}</div></div>`;
            document.getElementById('overlay-recipe').classList.remove('hidden');
        }
        function closeRecipeModal() { document.getElementById('overlay-recipe').classList.add('hidden'); }
        function editRecipeFromDetail() { closeRecipeModal(); openForm('receita', state.currentRecipeViewId); }
        function deleteRecipeFromDetail() { showCustomConfirm('Excluir esta receita?', async () => { state.receitas = state.receitas.filter(i => i.id !== state.currentRecipeViewId); await saveState(); closeRecipeModal(); render(); }); }

        function openOrderDetail(id) {
            closeAllModals(); state.currentOrderId = id; const p = state.pedidos.find(item => item.id === id); if (!p) return;
            let statusBg = 'bg-stone-100 text-stone-600'; if (p.status === 'Pendente') statusBg = 'bg-red-100 text-red-600'; else if (p.status === 'Em Produção') statusBg = 'bg-amber-100 text-amber-700'; else if (p.status === 'Entregue') statusBg = 'bg-green-100 text-green-600';
            const dataFormatada = p.dataEntrega ? p.dataEntrega.split('-').reverse().join('/') : 'Não definida';
            document.getElementById('order-detail-body').innerHTML = `
                ${p.img ? `<img src="${p.img}" style="object-position: ${p.imgPosX||50}% ${p.imgPosY||50}%;" class="w-full h-48 rounded-2xl object-cover border border-stone-200 shadow-sm cursor-pointer hover:opacity-95 transition-opacity" onclick="openFullscreenImg('${p.img}', '${p.item}')">` : ''}
                <div><h2 class="text-xl font-bold text-stone-900 mb-1">${p.item}</h2><p class="text-sm text-stone-600 mb-1">Cliente: <b>${p.cliente}</b></p><p class="text-sm text-stone-600 mb-1">Qtd: <b>${p.qtd || 1}</b></p><p class="text-sm text-stone-600 mb-3">Entrega: <b>${dataFormatada}</b></p><div class="flex gap-2 items-center mb-4"><span class="text-xs font-bold px-3 py-1 rounded-full ${statusBg}">${p.status}</span><span class="text-base font-heading font-bold text-brand">R$ ${Number(p.valor||0).toFixed(2).replace('.',',')}</span></div></div>
                <div><h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Observações</h4><div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${p.obs || 'Nenhuma observação.'}</div></div>`;
            document.getElementById('overlay-order').classList.remove('hidden');
        }
        function closeOrderModal() { document.getElementById('overlay-order').classList.add('hidden'); }
        function editOrderFromDetail() { closeOrderModal(); openForm('pedido', state.currentOrderId); }
        function deleteOrderFromDetail() { showCustomConfirm('Excluir este pedido?', async () => { state.pedidos = state.pedidos.filter(i => i.id !== state.currentOrderId); await saveState(); closeOrderModal(); render(); }); }

        function openStockDetail(id) {
            closeAllModals(); state.currentStockId = id; const e = state.estoque.find(item => item.id === id); if (!e) return;
            document.getElementById('stock-detail-body').innerHTML = `
                ${e.img ? `<img src="${e.img}" style="object-position: ${e.imgPosX||50}% ${e.imgPosY||50}%;" class="w-full h-48 rounded-2xl object-cover border border-stone-200 shadow-sm cursor-pointer hover:opacity-95 transition-opacity" onclick="openFullscreenImg('${e.img}', '${e.item}')">` : ''}
                <div><h2 class="text-xl font-bold text-stone-900 mb-1">${e.item}</h2><p class="text-sm text-stone-600 mb-4">Pronta Entrega: <b>${e.qtd}</b></p></div>
                <div><h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Observações</h4><div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${e.obs || 'Nenhuma observação.'}</div></div>`;
            document.getElementById('overlay-stock').classList.remove('hidden');
        }
        function closeStockModal() { document.getElementById('overlay-stock').classList.add('hidden'); }
        function editStockFromDetail() { closeStockModal(); openForm('estoque', state.currentStockId); }
        function deleteStockFromDetail() { showCustomConfirm('Excluir item do estoque?', async () => { state.estoque = state.estoque.filter(i => i.id !== state.currentStockId); await saveState(); closeStockModal(); render(); }); }

        function openProductDetail(id) {
            closeAllModals(); state.currentProductViewId = id; const pr = state.produtos.find(item => item.id === id); if (!pr) return;
            let partesHtml = ''; if (pr.partes && pr.partes.length > 0) { partesHtml = pr.partes.map((pt, idx) => pt.material ? `<div class="flex justify-between items-center text-xs bg-stone-50 p-2.5 rounded-xl border border-stone-100 mb-2"><span class="font-medium text-stone-700">Parte ${idx + 1}: ${pt.material}</span><span class="font-bold text-brand">${pt.peso}g</span></div>` : '').join(''); }
            document.getElementById('product-detail-body').innerHTML = `
                ${pr.img ? `<img src="${pr.img}" style="object-position: ${pr.imgPosX||50}% ${pr.imgPosY||50}%;" class="w-full h-48 rounded-2xl object-cover border border-stone-200 shadow-sm cursor-pointer hover:opacity-95 transition-opacity" onclick="openFullscreenImg('${pr.img}', '${pr.nome}')">` : ''}
                <div><h2 class="text-xl font-bold text-stone-900 mb-1">${pr.nome}</h2><div class="flex items-center gap-3 mb-4"><span class="text-base font-heading font-bold text-brand">R$ ${Number(pr.preco||0).toFixed(2).replace('.',',')}</span>${pr.tamanho ? `<span class="text-xs bg-stone-100 text-stone-700 px-2.5 py-1 rounded-lg font-semibold">Tamanho: ${pr.tamanho}</span>` : ''}</div></div>
                <div><h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Partes e Materiais</h4><div>${partesHtml || '<p class="text-xs text-stone-400">Nenhuma parte cadastrada.</p>'}</div></div>`;
            document.getElementById('overlay-product').classList.remove('hidden');
        }
        function closeProductModal() { document.getElementById('overlay-product').classList.add('hidden'); }
        function editProductFromDetail() { closeProductModal(); openForm('produto', state.currentProductViewId); }
        function deleteProductFromDetail() { showCustomConfirm('Excluir produto (removerá do estoque)?', async () => { const pr = state.produtos.find(i => i.id === state.currentProductViewId); if (pr) { state.estoque = state.estoque.filter(e => e.item !== pr.nome); } state.produtos = state.produtos.filter(i => i.id !== state.currentProductViewId); await saveState(); closeProductModal(); render(); }); }

        function deleteInsightItem(itemId) {
            showCustomConfirm('Excluir esta foto?', async () => {
                const folder = state.insights.find(f => f.id === state.currentInsightFolderId);
                if (folder) {
                    folder.items = folder.items.filter(i => i.id !== itemId);
                    await saveState();
                    render();
                }
            });
        }

        function closeAllModals() {
            document.getElementById('overlay-form').classList.add('hidden');
            document.getElementById('overlay-recipe').classList.add('hidden');
            document.getElementById('overlay-order').classList.add('hidden');
            document.getElementById('overlay-stock').classList.add('hidden');
            document.getElementById('overlay-product').classList.add('hidden');
            document.getElementById('overlay-confirm').classList.add('hidden');
            document.getElementById('overlay-custom-select').classList.add('hidden');
        }

        async function submitForm() {
            const { type, editingId, tempImage, tempImagesMultiple, tempImgPosX, tempImgPosY, tempPartes } = state.formState;
            const def = formDefinitions[type];
            let newData = { id: editingId || Date.now(), imgPosX: tempImgPosX, imgPosY: tempImgPosY };

            def.fields.forEach(f => {
                if (f.type === 'file') newData[f.key] = tempImage;
                else if (f.type === 'multiple_files') {}
                else if (f.type === 'dynamic_parts') newData[f.key] = tempPartes.filter(p => p.material || p.peso);
                else if (f.type === 'checkbox') newData[f.key] = document.getElementById(f.id).checked;
                else { let val = document.getElementById(f.id).value; if (f.type === 'number') val = parseFloat(val) || 0; newData[f.key] = val; }
            });

            if (type === 'perfil') state.config = { ...state.config, ...newData };
            else if (type === 'pasta_insight') {
                if (editingId) state.insights[state.insights.findIndex(i => i.id === editingId)].nome = newData.nome; else state.insights.push({ id: newData.id, nome: newData.nome, items: [] });
                navigate('insights');
            }
            else if (type === 'insight_image') {
                const folder = state.insights.find(f => f.id === state.currentInsightFolderId);
                if (tempImagesMultiple && tempImagesMultiple.length > 0) {
                    tempImagesMultiple.forEach(imgUrl => {
                        folder.items.push({ id: Date.now() + Math.random(), tipo: 'image', conteudo: imgUrl, titulo: '', imgPosX: 50, imgPosY: 50 });
                    });
                }
                navigate('insight_folder');
            }
            else if (type === 'insight_link') {
                newData.tipo = 'link'; const folder = state.insights.find(f => f.id === state.currentInsightFolderId);
                if (editingId) folder.items[folder.items.findIndex(i => i.id === editingId)] = newData; else folder.items.push(newData);
                navigate('insight_folder');
            }
            else if (type === 'produto') {
                if (editingId) state.produtos[state.produtos.findIndex(i => i.id === editingId)] = newData; else state.produtos.push(newData);
                navigate('produtos');
            } else if (type === 'estoque') {
                const prod = state.produtos.find(p => p.nome === newData.item);
                if (prod) {
                    newData.img = prod.img || '';
                    newData.imgPosX = prod.imgPosX !== undefined ? prod.imgPosX : 50;
                    newData.imgPosY = prod.imgPosY !== undefined ? prod.imgPosY : 50;
                }
                if (!newData.qtd || newData.qtd <= 0) { if (editingId) state.estoque = state.estoque.filter(i => i.id !== editingId); } 
                else {
                    if (editingId) state.estoque[state.estoque.findIndex(i => i.id === editingId)] = newData;
                    else {
                        const existingIndex = state.estoque.findIndex(e => e.item === newData.item);
                        if (existingIndex !== -1) { state.estoque[existingIndex].qtd = (parseFloat(state.estoque[existingIndex].qtd) || 0) + (parseFloat(newData.qtd) || 0); if (newData.obs) state.estoque[existingIndex].obs = newData.obs; if (newData.img) state.estoque[existingIndex].img = newData.img; state.estoque[existingIndex].imgPosX = newData.imgPosX; state.estoque[existingIndex].imgPosY = newData.imgPosY; } 
                        else state.estoque.push(newData);
                    }
                }
                navigate('estoque');
            } else if (type === 'pedido') {
                if (!newData.qtd || newData.qtd < 1) newData.qtd = 1;
                const prod = state.produtos.find(p => p.nome === newData.item); 
                newData.valor = (prod ? Number(prod.preco || 0) : 0) * newData.qtd;
                
                if (prod) {
                    newData.img = prod.img || '';
                    newData.imgPosX = prod.imgPosX !== undefined ? prod.imgPosX : 50;
                    newData.imgPosY = prod.imgPosY !== undefined ? prod.imgPosY : 50;
                }

                if (newData.venderEstoque && newData.qtd > 0) {
                    const stockItem = state.estoque.find(e => e.item === newData.item);
                    if (stockItem) { stockItem.qtd = Math.max(0, (parseFloat(stockItem.qtd) || 0) - parseFloat(newData.qtd)); if (stockItem.qtd <= 0) state.estoque = state.estoque.filter(e => e.id !== stockItem.id); }
                }
                if (editingId) state.pedidos[state.pedidos.findIndex(i => i.id === editingId)] = newData; else state.pedidos.push(newData);
                navigate('pedidos');
            } else if (type === 'custo') {
                newData.custoFio = (newData.precoRolo / newData.pesoRolo) * newData.pesoGasto; newData.custoTotal = newData.custoFio + newData.extras + (newData.horas * newData.valorHora);
                if (editingId) state.custos[state.custos.findIndex(i => i.id === editingId)] = newData; else state.custos.push(newData);
                navigate('custos');
            } else {
                const targetArray = type === 'financeiro' ? 'financeiro' : type + 's';
                if (editingId) state[targetArray][state[targetArray].findIndex(i => i.id === editingId)] = newData; else state[targetArray].push(newData);
                if (!editingId && ['pedido', 'estoque', 'receita', 'financeiro'].includes(type)) navigate(type === 'estoque' ? 'estoque' : (type === 'financeiro' ? 'financeiro' : type + 's'));
            }
            await saveState(); closeAllModals(); render();
        }

        function deleteCurrentItem() {
            showCustomConfirm('Tem certeza que deseja excluir este item?', async () => {
                const { type, editingId } = state.formState;
                if (type === 'pasta_insight') { state.insights = state.insights.filter(i => i.id !== editingId); navigate('insights'); }
                else if (type === 'insight_link') { const folder = state.insights.find(f => f.id === state.currentInsightFolderId); folder.items = folder.items.filter(i => i.id !== editingId); navigate('insight_folder'); }
                else if (type === 'produto') { const pr = state.produtos.find(i => i.id === editingId); if (pr) { state.estoque = state.estoque.filter(e => e.item !== pr.nome); } state.produtos = state.produtos.filter(i => i.id !== editingId); } 
                else { const targetArray = type === 'pedido' ? 'pedidos' : (type === 'financeiro' ? 'financeiro' : (type === 'estoque' ? 'estoque' : (type === 'custo' ? 'custos' : (type === 'receita' ? 'receitas' : type + 's')))); state[targetArray] = state[targetArray].filter(i => i.id !== editingId); }
                await saveState(); closeAllModals(); render();
            });
        }

        async function initApp() {
            await loadState();
            render();
        }

        initApp();
    </script>
    <script> if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); } </script>
</body>
