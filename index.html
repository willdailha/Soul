<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUL - Gestão de Ateliê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Manrope', 'sans-serif'] },
                    colors: { brand: { light: '#F4E3E1', DEFAULT: '#A84A5C', dark: '#8A3A4C', accent: '#E5D0CB' }, bg: '#FDFDFB' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #e5e5e5; }
        .app-shell { background-color: #FDFDFB; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#b85d59">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="flex justify-center min-h-screen relative">

    <!-- App Shell -->
    <div class="app-shell w-full max-w-md min-h-screen relative shadow-2xl overflow-x-hidden flex flex-col">

        <!-- Header -->
        <header class="flex items-center justify-between px-5 pt-6 pb-3 sticky top-0 bg-[#FDFDFB] z-10 border-b border-stone-100">
            <div class="flex items-center gap-3">
                <button onclick="openForm('perfil')" class="w-11 h-11 rounded-full overflow-hidden bg-brand-accent flex items-center justify-center active:scale-95 transition-transform border border-stone-200">
                    <img id="header-avatar" src="https://ui-avatars.com/api/?name=SOUL&background=E5D0CB&color=A84A5C" alt="Avatar" class="w-full h-full object-cover">
                </button>
                <div class="leading-tight cursor-pointer" onclick="openForm('perfil')">
                    <h1 id="header-atelier" class="font-heading text-lg font-bold text-stone-900">SOUL</h1>
                    <p id="header-artesao" class="text-xs text-stone-500">William</p>
                </div>
            </div>
            <button onclick="openForm('perfil')" class="p-2 text-stone-400 bg-stone-50 rounded-full active:scale-95"><i data-lucide="settings" class="w-5 h-5 pointer-events-none"></i></button>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar pb-24"></main>

        <!-- Bottom Navigation (Reformulada: Mais limpa e sem botão central) -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 pb-safe pt-2 px-2 flex items-center justify-around z-40">
            <button onclick="navigate('home')" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 text-[10px] font-medium text-brand" data-target="home"><i data-lucide="house" class="w-6 h-6 pointer-events-none"></i><span>Início</span></button>
            <button onclick="navigate('pedidos')" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 text-[10px] font-medium text-stone-400" data-target="pedidos"><i data-lucide="box" class="w-6 h-6 pointer-events-none"></i><span>Pedidos</span></button>
            <button onclick="navigate('estoque')" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 text-[10px] font-medium text-stone-400" data-target="estoque"><i data-lucide="package" class="w-6 h-6 pointer-events-none"></i><span>Estoque</span></button>
            <button onclick="navigate('produtos')" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 text-[10px] font-medium text-stone-400" data-target="produtos"><i data-lucide="tag" class="w-6 h-6 pointer-events-none"></i><span>Produtos</span></button>
        </nav>
    </div>

    <!-- OVERLAY 2: Formulário Centralizado -->
    <div id="overlay-form" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div id="modal-form" class="bg-white w-full max-w-md h-[85vh] rounded-[28px] p-6 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 id="form-title" class="font-heading text-lg font-bold">Formulário</h3>
                <button onclick="closeFormModal()" class="p-2 bg-stone-100 rounded-full active:scale-95"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
            </div>

            <div id="form-body" class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4"></div>

            <div class="mt-4 flex gap-2 shrink-0 border-t border-stone-100 pt-4">
                <button id="btn-delete" onclick="deleteCurrentItem()" class="hidden bg-red-100 text-red-600 px-4 rounded-xl font-bold active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i></button>
                <button onclick="submitForm()" class="flex-1 bg-brand text-white font-semibold py-4 rounded-xl active:scale-95 transition-transform">Salvar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY 3: Visualizador de Receita Detalhada -->
    <div id="overlay-recipe" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[28px] p-6 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="font-heading text-lg font-bold">Detalhes da Receita</h3>
                <button onclick="closeRecipeModal()" class="p-2 bg-stone-100 rounded-full active:scale-95"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
            </div>
            <div id="recipe-detail-body" class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4"></div>
            <div class="mt-4 flex gap-2 shrink-0 border-t border-stone-100 pt-4">
                <button onclick="deleteRecipeFromDetail()" class="bg-red-100 text-red-600 px-4 rounded-xl font-bold active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i></button>
                <button onclick="editRecipeFromDetail()" class="flex-1 bg-stone-100 text-stone-800 font-semibold py-3 rounded-xl active:scale-95 transition-transform">Editar</button>
                <button onclick="closeRecipeModal()" class="flex-1 bg-brand text-white font-semibold py-3 rounded-xl active:scale-95 transition-transform">Fechar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY 4: Visualizador de Pedido Detalhado -->
    <div id="overlay-order" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[28px] p-6 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="font-heading text-lg font-bold">Detalhes do Pedido</h3>
                <button onclick="closeOrderModal()" class="p-2 bg-stone-100 rounded-full active:scale-95"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
            </div>
            <div id="order-detail-body" class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4"></div>
            <div class="mt-4 flex gap-2 shrink-0 border-t border-stone-100 pt-4">
                <button onclick="deleteOrderFromDetail()" class="bg-red-100 text-red-600 px-4 rounded-xl font-bold active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i></button>
                <button onclick="editOrderFromDetail()" class="flex-1 bg-stone-100 text-stone-800 font-semibold py-3 rounded-xl active:scale-95 transition-transform">Editar</button>
                <button onclick="closeOrderModal()" class="flex-1 bg-brand text-white font-semibold py-3 rounded-xl active:scale-95 transition-transform">Fechar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY 5: Visualizador de Estoque Detalhado -->
    <div id="overlay-stock" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[28px] p-6 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="font-heading text-lg font-bold">Detalhes do Item</h3>
                <button onclick="closeStockModal()" class="p-2 bg-stone-100 rounded-full active:scale-95"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
            </div>
            <div id="stock-detail-body" class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4"></div>
            <div class="mt-4 flex gap-2 shrink-0 border-t border-stone-100 pt-4">
                <button onclick="deleteStockFromDetail()" class="bg-red-100 text-red-600 px-4 rounded-xl font-bold active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i></button>
                <button onclick="editStockFromDetail()" class="flex-1 bg-stone-100 text-stone-800 font-semibold py-3 rounded-xl active:scale-95 transition-transform">Editar</button>
                <button onclick="closeStockModal()" class="flex-1 bg-brand text-white font-semibold py-3 rounded-xl active:scale-95 transition-transform">Fechar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY 6: Visualizador de Produto Detalhado -->
    <div id="overlay-product" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md h-[85vh] rounded-[28px] p-6 flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h3 class="font-heading text-lg font-bold">Detalhes do Produto</h3>
                <button onclick="closeProductModal()" class="p-2 bg-stone-100 rounded-full active:scale-95"><i data-lucide="x" class="w-4 h-4 pointer-events-none"></i></button>
            </div>
            <div id="product-detail-body" class="overflow-y-auto no-scrollbar flex-1 pb-4 space-y-4"></div>
            <div class="mt-4 flex gap-2 shrink-0 border-t border-stone-100 pt-4">
                <button onclick="deleteProductFromDetail()" class="bg-red-100 text-red-600 px-4 rounded-xl font-bold active:scale-95 transition-transform"><i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i></button>
                <button onclick="editProductFromDetail()" class="flex-1 bg-stone-100 text-stone-800 font-semibold py-3 rounded-xl active:scale-95 transition-transform">Editar</button>
                <button onclick="closeProductModal()" class="flex-1 bg-brand text-white font-semibold py-3 rounded-xl active:scale-95 transition-transform">Fechar</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY 7: Modal de Confirmação Personalizado -->
    <div id="overlay-confirm" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[28px] p-6 flex flex-col shadow-2xl text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="alert-triangle" class="w-6 h-6 pointer-events-none"></i>
            </div>
            <h3 class="font-heading text-lg font-bold text-stone-900 mb-2">Excluir item</h3>
            <p id="confirm-message" class="text-xs text-stone-500 mb-6">Tem certeza que deseja excluir este item permanentemente?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 bg-stone-100 text-stone-700 font-semibold py-3 rounded-xl active:scale-95 transition-transform">Cancelar</button>
                <button id="confirm-btn-yes" class="flex-1 bg-red-600 text-white font-semibold py-3 rounded-xl active:scale-95 transition-transform">Excluir</button>
            </div>
        </div>
    </div>

    <script>
        // --- ESTADO GLOBAL & LOCAL STORAGE ROBUSTO ---
        const STORAGE_KEY = 'soul_atelier_data_v4';

        const state = {
            currentView: 'home',
            config: { artisanName: 'William', atelierName: 'SOUL', avatar: '', avatarPos: 'center' },
            pedidos: [],
            estoque: [],
            receitas: [],
            custos: [],
            financeiro: [],
            produtos: [],
            formState: { type: null, editingId: null, tempImage: null, tempImgPos: 'center' },
            currentRecipeViewId: null,
            currentOrderId: null,
            currentStockId: null,
            currentProductViewId: null
        };

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Erro ao salvar no localStorage:", e);
                alert("Atenção: O armazenamento ficou cheio devido ao tamanho das fotos. Tente usar fotos mais leves.");
            }
        }

        function loadState() {
            const keysToTry = [STORAGE_KEY, 'soul_atelier_data_v3', 'soul_atelier_data_v2', 'soul_atelier_data_v1', 'soul_atelier_state_v4', 'soul_atelier_state_v3'];
            for (const k of keysToTry) {
                const saved = localStorage.getItem(k);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.config) state.config = { ...state.config, ...parsed.config };
                        if (parsed.pedidos) state.pedidos = parsed.pedidos;
                        if (parsed.estoque) state.estoque = parsed.estoque.filter(e => parseFloat(e.qtd || 0) > 0);
                        if (parsed.receitas) state.receitas = parsed.receitas;
                        if (parsed.custos) state.custos = parsed.custos;
                        if (parsed.financeiro) state.financeiro = parsed.financeiro;
                        if (parsed.produtos) state.produtos = parsed.produtos;
                        break;
                    } catch(e) {
                        console.error("Erro ao carregar chave", k, e);
                    }
                }
            }
        }

        loadState();

        // --- MODAL DE CONFIRMAÇÃO CUSTOMIZADO ---
        let confirmCallback = null;
        function showCustomConfirm(message, callback) {
            document.getElementById('confirm-message').innerText = message || 'Tem certeza que deseja excluir este item permanentemente?';
            confirmCallback = callback;
            document.getElementById('overlay-confirm').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeConfirmModal() {
            document.getElementById('overlay-confirm').classList.add('hidden');
            confirmCallback = null;
        }
        document.getElementById('confirm-btn-yes').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        // --- SISTEMA DE DRAG & DROP (REORGANIZAR LISTAS) ---
        let draggedData = { index: null, arrayName: null };

        function drag(ev, index, arrayName) {
            draggedData = { index, arrayName };
            ev.dataTransfer.effectAllowed = 'move';
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.dataTransfer.dropEffect = 'move';
        }

        function drop(ev, targetIndex, arrayName) {
            ev.preventDefault();
            if (draggedData.arrayName !== arrayName || draggedData.index === null || draggedData.index === targetIndex) return;
            const arr = state[arrayName];
            const item = arr.splice(draggedData.index, 1)[0];
            arr.splice(targetIndex, 0, item);
            draggedData = { index: null, arrayName: null };
            saveState();
            render();
        }

        // --- MAPEAR CLASSE CSS PARA POSIÇÃO DA IMAGEM ---
        function getPosClass(pos) {
            if (pos === 'top') return 'object-top';
            if (pos === 'bottom') return 'object-bottom';
            if (pos === 'left') return 'object-left';
            if (pos === 'right') return 'object-right';
            return 'object-center';
        }

        // --- SISTEMA DE VIEWS ---
        const views = {
            home: () => {
                const entregues = state.pedidos.filter(p => p.status === 'Entregue');
                const faturamentoBruto = entregues.reduce((acc, p) => acc + Number(p.valor || 0), 0);
                const totalDespesas = state.financeiro.reduce((acc, t) => acc + Number(t.valor || 0), 0);
                const faturamentoLiquido = faturamentoBruto - totalDespesas;

                return `
                <div class="px-5 space-y-5 fade-in pt-2">
                    <div>
                        <h2 class="font-heading text-2xl font-bold text-stone-900 tracking-tight">Olá, ${state.config.artisanName}</h2>
                        <p class="text-sm text-stone-500 mt-1">${entregues.length} pedidos entregues</p>
                    </div>
                    <div class="w-full text-left bg-gradient-to-br from-[#A84A5C] to-[#8A3A4C] rounded-[28px] p-6 text-white shadow-lg">
                        <p class="text-xs uppercase tracking-[0.15em] opacity-80 mb-1">Faturamento Líquido</p>
                        <p class="font-heading text-3xl font-bold">R$ ${faturamentoLiquido.toFixed(2).replace('.',',')}</p>
                        <div class="flex justify-between text-xs opacity-90 mt-4 pt-4 border-t border-white/20">
                            <span>Entradas: R$ ${faturamentoBruto.toFixed(2).replace('.',',')}</span>
                            <span>Despesas: R$ ${totalDespesas.toFixed(2).replace('.',',')}</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="navigate('pedidos')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-[#F4E3E1] text-[#A84A5C] flex items-center justify-center"><i data-lucide="package" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Pedidos</span></button>
                        <button onclick="navigate('produtos')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-[#EBE9DE] text-[#8A7A3F] flex items-center justify-center"><i data-lucide="tag" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Produtos</span></button>
                        <button onclick="navigate('estoque')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-[#E4E9E1] text-[#54624D] flex items-center justify-center"><i data-lucide="box" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Estoque</span></button>
                        <button onclick="navigate('financeiro')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center"><i data-lucide="wallet" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Despesas</span></button>
                        <button onclick="navigate('receitas')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-[#EBE9DE] text-[#8A7A3F] flex items-center justify-center"><i data-lucide="book-open" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Receitas</span></button>
                        <button onclick="navigate('custos')" class="bg-white rounded-[22px] p-5 shadow-sm flex flex-col gap-3 active:scale-95 transition-transform"><div class="w-11 h-11 rounded-2xl bg-[#EFE2DE] text-[#B65D41] flex items-center justify-center"><i data-lucide="scale" class="pointer-events-none"></i></div><span class="font-bold text-sm text-stone-800">Custos</span></button>
                    </div>
                </div>`;
            },

            pedidos: () => generateListHTML('Pedidos', 'pedidos', 'pedido', (p) => {
                let statusBg = 'bg-stone-100 text-stone-600';
                if (p.status === 'Pendente') statusBg = 'bg-red-100 text-red-600';
                else if (p.status === 'Em Produção') statusBg = 'bg-amber-100 text-amber-700';
                else if (p.status === 'Entregue') statusBg = 'bg-green-100 text-green-600';

                const imgPosClass = getPosClass(p.imgPos);

                return `
                <div class="flex gap-4 cursor-pointer items-center w-full" onclick="openOrderDetail(${p.id})">
                    ${p.img ? `<img src="${p.img}" class="w-20 h-20 rounded-xl object-cover ${imgPosClass} shrink-0 border border-stone-100">` : `<div class="w-20 h-20 rounded-xl bg-stone-100 flex items-center justify-center text-stone-300 shrink-0"><i data-lucide="image" class="pointer-events-none"></i></div>`}
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-stone-800 truncate">${p.item} <span class="text-xs font-normal text-stone-500">(Qtd: ${p.qtd || 1})</span></h4>
                        <p class="text-xs text-stone-500 mb-1">Cliente: ${p.cliente}</p>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${statusBg}">${p.status}</span>
                        <p class="text-sm font-bold text-brand mt-1">R$ ${Number(p.valor || 0).toFixed(2).replace('.',',')}</p>
                    </div>
                    <button onclick="event.stopPropagation(); openForm('pedido', ${p.id})" class="text-stone-400 p-2 active:scale-95 shrink-0"><i data-lucide="edit-3" class="w-4 h-4 pointer-events-none"></i></button>
                </div>`;
            }),

            produtos: () => generateListHTML('Produtos', 'produtos', 'produto', (pr) => {
                const imgPosClass = getPosClass(pr.imgPos);
                return `
                <div class="flex gap-4 cursor-pointer items-center w-full" onclick="openProductDetail(${pr.id})">
                    ${pr.img ? `<img src="${pr.img}" class="w-16 h-16 rounded-xl object-cover ${imgPosClass} shrink-0 border border-stone-100">` : `<div class="w-16 h-16 rounded-xl bg-stone-100 flex items-center justify-center text-stone-300 shrink-0"><i data-lucide="tag" class="pointer-events-none"></i></div>`}
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-stone-800 truncate">${pr.nome}</h4>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-brand">R$ ${Number(pr.preco || 0).toFixed(2).replace('.',',')}</span>
                            ${pr.tamanho ? `<span class="text-[11px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded-md font-medium">${pr.tamanho}</span>` : ''}
                        </div>
                        <p class="text-[11px] text-stone-400 truncate">Partes: ${pr.partes ? pr.partes.filter(pt => pt.material).map(pt => pt.material + ' (' + pt.peso + 'g)').join(', ') || 'Nenhuma parte' : ''}</p>
                    </div>
                    <button onclick="event.stopPropagation(); openForm('produto', ${pr.id})" class="text-stone-400 p-2 active:scale-95 shrink-0"><i data-lucide="edit-3" class="w-4 h-4 pointer-events-none"></i></button>
                </div>
            `;
            }),

            estoque: () => generateListHTML('Estoque', 'estoque', 'estoque', (e) => {
                const imgPosClass = getPosClass(e.imgPos);
                return `
                <div class="flex gap-4 items-center cursor-pointer w-full" onclick="openStockDetail(${e.id})">
                    ${e.img ? `<img src="${e.img}" class="w-14 h-14 rounded-xl object-cover ${imgPosClass} shrink-0 border border-stone-100">` : `<div class="w-14 h-14 rounded-xl bg-stone-100 flex items-center justify-center text-stone-300 shrink-0"><i data-lucide="package" class="pointer-events-none"></i></div>`}
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-stone-800 truncate">${e.item}</h4>
                        <p class="text-xs text-stone-500">Pronta Entrega: <span class="font-bold text-stone-700">${e.qtd}</span></p>
                    </div>

        // --- DEFINIÇÃO DOS FORMULÁRIOS ---

        // --- ATUALIZAR LISTA DE PRODUTOS NO PEDIDO (COM FILTRO DE ESTOQUE) ---
        function updateProductSelectOptions(selectedVal = '') {
            const selectEl = document.getElementById('f-item');
            const checkboxEl = document.getElementById('f-venderEstoque');
            if (!selectEl) return;
            
            const onlyStock = checkboxEl ? checkboxEl.checked : false;
            let availableProducts = state.produtos;

            if (onlyStock) {
                const stockProductNames = state.estoque
                    .filter(e => parseFloat(e.qtd || 0) > 0)
                    .map(e => e.item);
                availableProducts = state.produtos.filter(p => stockProductNames.includes(p.nome));
            }

            let optionsHtml = '';
            if (availableProducts.length === 0) {
                optionsHtml = `<option value="">${onlyStock ? 'Nenhum produto disponível em estoque' : 'Nenhum produto cadastrado'}</option>`;
            } else {
                optionsHtml = `<option value="">Selecione um produto...</option>` + availableProducts.map(p => `<option value="${p.nome}" ${selectedVal===p.nome?'selected':''}>${p.nome} (R$ ${Number(p.preco||0).toFixed(2)})</option>`).join('');
            }
            selectEl.innerHTML = optionsHtml;
        }

        // --- CONTROLE DE MODAIS ---
        function openForm(type, id = null) {
            closeAllModals();

            state.formState = { type, editingId: id, tempImage: null, tempImgPos: 'center' };
            const def = formDefinitions[type];
            document.getElementById('form-title').innerText = id ? 'Editar ' + def.title : (type==='perfil' ? def.title : 'Novo(a) ' + def.title);

            let item = {};
            if (type === 'perfil') item = state.config;
            else if (id) {
                const arr = type === 'financeiro' ? state.financeiro : (type === 'produto' ? state.produtos : (type === 'estoque' ? state.estoque : state[type + 's']));
                item = arr.find(i => i.id === id);
            }

            if (item && item.imgPos) {
                state.formState.tempImgPos = item.imgPos;
            }

            if (type === 'produto' && item && item.partes) {
                item.mat1 = item.partes[0]?.material || '';
                item.pes1 = item.partes[0]?.peso || '';
                item.mat2 = item.partes[1]?.material || '';
                item.pes2 = item.partes[1]?.peso || '';
                item.mat3 = item.partes[2]?.material || '';
                item.pes3 = item.partes[2]?.peso || '';
                item.mat4 = item.partes[3]?.material || '';
                item.pes4 = item.partes[3]?.peso || '';
            }

            let html = '';
            def.fields.forEach(f => {
                let val = item && item[f.key] !== undefined ? item[f.key] : '';
                if (f.key === 'data' && !val) val = new Date().toISOString().split('T')[0];
                if (f.key === 'qtd' && !val && (type === 'pedido' || type === 'estoque')) val = 1;

                if (f.type === 'imgpos') {
                    // Renderiza seletor de enquadramento se houver imagem ou sempre integrado
                    let currentPos = val || state.formState.tempImgPos || 'center';
                    html += `
                        <div id="imgpos-container" class="mb-4 ${!state.formState.tempImage && !item?.img ? 'hidden' : ''}">
                            <label class="block text-xs font-bold text-stone-500 mb-1">${f.label}</label>
                            <div class="grid grid-cols-5 gap-1.5 bg-stone-50 p-1.5 rounded-xl border border-stone-200">
                                <button type="button" onclick="setImgPos('top', this)" class="imgpos-btn py-2 text-xs font-semibold rounded-lg ${currentPos==='top'?'bg-brand text-white':'text-stone-600 hover:bg-stone-200'}">Topo</button>
                                <button type="button" onclick="setImgPos('center', this)" class="imgpos-btn py-2 text-xs font-semibold rounded-lg ${currentPos==='center'?'bg-brand text-white':'text-stone-600 hover:bg-stone-200'}">Centro</button>
                                <button type="button" onclick="setImgPos('bottom', this)" class="imgpos-btn py-2 text-xs font-semibold rounded-lg ${currentPos==='bottom'?'bg-brand text-white':'text-stone-600 hover:bg-stone-200'}">Base</button>
                                <button type="button" onclick="setImgPos('left', this)" class="imgpos-btn py-2 text-xs font-semibold rounded-lg ${currentPos==='left'?'bg-brand text-white':'text-stone-600 hover:bg-stone-200'}">Esq.</button>
                                <button type="button" onclick="setImgPos('right', this)" class="imgpos-btn py-2 text-xs font-semibold rounded-lg ${currentPos==='right'?'bg-brand text-white':'text-stone-600 hover:bg-stone-200'}">Dir.</button>
                            </div>
                        </div>`;
                    return;
                }

                html += `<div class="mb-4"><label class="block text-xs font-bold text-stone-500 mb-1">${f.label}</label>`;

                if (f.type === 'textarea') {
                    html += `<textarea id="${f.id}" rows="4" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm">${val}</textarea>`;
                } else if (f.type === 'select') {
                    html += `<select id="${f.id}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm">${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
                } else if (f.type === 'product_select') {
                    html += `<select id="${f.id}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm"><option value="">Carregando...</option></select>`;
                } else if (f.type === 'product_select_all') {
                    let optionsHtml = state.produtos.length === 0 ? '<option value="">Nenhum produto cadastrado</option>' : '<option value="">Selecione um produto...</option>' + state.produtos.map(p => `<option value="${p.nome}" ${val===p.nome?'selected':''}>${p.nome}</option>`).join('');
                    html += `<select id="${f.id}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm">${optionsHtml}</select>`;
                } else if (f.type === 'checkbox') {
                    html += `<input type="checkbox" id="${f.id}" ${val ? 'checked' : ''} class="w-5 h-5 accent-brand rounded border-stone-300">`;
                } else if (f.type === 'file') {
                    html += `
                        <div class="flex items-center gap-3">
                            ${val ? `<img id="${f.id}-preview" src="${val}" class="w-16 h-16 rounded-lg object-cover ${getPosClass(item.imgPos)} border border-stone-200 shadow-sm">` : `<img id="${f.id}-preview" class="w-16 h-16 rounded-lg object-cover hidden border border-stone-200 shadow-sm">`}
                            <input type="file" accept="image/*" onchange="handleImageUpload(event, '${f.id}-preview')" class="text-xs file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brand-light file:text-brand hover:file:bg-brand-accent transition-colors">
                        </div>`;
                    if (val) state.formState.tempImage = val;
                } else {
                    html += `<input type="${f.type}" id="${f.id}" value="${val}" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 outline-none focus:border-brand text-sm">`;
                }
                html += `</div>`;
            });

            document.getElementById('form-body').innerHTML = html;
            document.getElementById('btn-delete').classList.toggle('hidden', !id);

            if (type === 'pedido') {
                updateProductSelectOptions(item ? item.item : '');
                const cb = document.getElementById('f-venderEstoque');
                if (cb) {
                    cb.addEventListener('change', () => {
                        updateProductSelectOptions();
                    });
                }
            }

            document.getElementById('overlay-form').classList.remove('hidden');
        }

        function setImgPos(pos, btnEl) {
            state.formState.tempImgPos = pos;
            const container = btnEl.closest('div');
            container.querySelectorAll('.imgpos-btn').forEach(b => {
                b.className = "imgpos-btn py-2 text-xs font-semibold rounded-lg text-stone-600 hover:bg-stone-200";
            });
            btnEl.className = "imgpos-btn py-2 text-xs font-semibold rounded-lg bg-brand text-white";

            // Atualiza preview se houver
            const previews = document.querySelectorAll('img[id$="-preview"]');
            previews.forEach(img => {
                img.className = `w-16 h-16 rounded-lg object-cover ${getPosClass(pos)} border border-stone-200 shadow-sm`;
            });
        }

        function closeFormModal() {
            document.getElementById('overlay-form').classList.add('hidden');
        }

        // --- COMPRESSÃO AUTOMÁTICA DE IMAGEM ---
        function handleImageUpload(event, previewId) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                        const previewEl = document.getElementById(previewId);
                        previewEl.src = compressedDataUrl;
                        previewEl.className = `w-16 h-16 rounded-lg object-cover ${getPosClass(state.formState.tempImgPos)} border border-stone-200 shadow-sm`;
                        previewEl.classList.remove('hidden');
                        state.formState.tempImage = compressedDataUrl;

                        // Exibe o seletor de enquadramento se estiver oculto
                        const imgPosContainer = document.getElementById('imgpos-container');
                        if (imgPosContainer) imgPosContainer.classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // --- CONTROLE DE VISUALIZAÇÃO DE RECEITAS ---
        function openRecipeDetail(id) {
            closeAllModals();
            state.currentRecipeViewId = id;
            const r = state.receitas.find(item => item.id === id);

                <div>
                    <h2 class="text-xl font-bold text-stone-900 mb-2">${r.nome}</h2>
                    <div class="flex gap-2 text-xs text-stone-600 mb-4">
                        <span class="bg-stone-100 px-3 py-1.5 rounded-xl">Fio: <b>${r.fio}</b></span>
                        <span class="bg-stone-100 px-3 py-1.5 rounded-xl">Agulha: <b>${r.agulha}</b></span>
                    </div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Passo a passo / Anotações</h4>
                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${r.desc || 'Nenhum passo a passo cadastrado.'}</div>
                </div>

            document.getElementById('overlay-recipe').classList.remove('hidden');

        function editRecipeFromDetail() { closeRecipeModal(); openForm('receita', state.currentRecipeViewId); }
        function deleteRecipeFromDetail() {
            showCustomConfirm('Tem certeza que deseja excluir esta receita?', () => {
                state.receitas = state.receitas.filter(i => i.id !== state.currentRecipeViewId);
                saveState();
                closeRecipeModal();
                render();
            });
        }

        // --- CONTROLE DE VISUALIZAÇÃO DE PEDIDOS ---
        function openOrderDetail(id) {
            closeAllModals();
            state.currentOrderId = id;
            const p = state.pedidos.find(item => item.id === id);
            if (!p) return;

            let statusBg = 'bg-stone-100 text-stone-600';
            if (p.status === 'Pendente') statusBg = 'bg-red-100 text-red-600';
            else if (p.status === 'Em Produção') statusBg = 'bg-amber-100 text-amber-700';
            else if (p.status === 'Entregue') statusBg = 'bg-green-100 text-green-600';

            const imgPosClass = getPosClass(p.imgPos);
            let html = `
                ${p.img ? `<img src="${p.img}" class="w-full h-48 rounded-2xl object-cover ${imgPosClass} border border-stone-200 shadow-sm">` : ''}
                <div>
                    <h2 class="text-xl font-bold text-stone-900 mb-1">${p.item}</h2>
                    <p class="text-sm text-stone-600 mb-1">Cliente: <b>${p.cliente}</b></p>
                    <p class="text-sm text-stone-600 mb-3">Quantidade: <b>${p.qtd || 1}</b></p>
                    <div class="flex gap-2 items-center mb-4">
                        <span class="text-xs font-bold px-3 py-1 rounded-full ${statusBg}">${p.status}</span>
                        <span class="text-base font-heading font-bold text-brand">R$ ${Number(p.valor||0).toFixed(2).replace('.',',')}</span>
                    </div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Observações</h4>
                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${p.obs || 'Nenhuma observação cadastrada.'}</div>
                </div>
            `;
            document.getElementById('order-detail-body').innerHTML = html;
            document.getElementById('overlay-order').classList.remove('hidden');
        }
        function closeOrderModal() { document.getElementById('overlay-order').classList.add('hidden'); }
        function editOrderFromDetail() { closeOrderModal(); openForm('pedido', state.currentOrderId); }
        function deleteOrderFromDetail() {
            showCustomConfirm('Tem certeza que deseja excluir este pedido?', () => {
                state.pedidos = state.pedidos.filter(i => i.id !== state.currentOrderId);
                saveState();
                closeOrderModal();
                render();
            });
        }

        // --- CONTROLE DE VISUALIZAÇÃO DE ESTOQUE ---
        function openStockDetail(id) {
            closeAllModals();
            state.currentStockId = id;
            const e = state.estoque.find(item => item.id === id);
            if (!e) return;

            const imgPosClass = getPosClass(e.imgPos);
            let html = `
                ${e.img ? `<img src="${e.img}" class="w-full h-48 rounded-2xl object-cover ${imgPosClass} border border-stone-200 shadow-sm">` : ''}
                <div>
                    <h2 class="text-xl font-bold text-stone-900 mb-1">${e.item}</h2>
                    <p class="text-sm text-stone-600 mb-4">Pronta Entrega: <b>${e.qtd}</b></p>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Observações</h4>
                    <div class="bg-stone-50 p-4 rounded-2xl border border-stone-100 text-stone-800 text-sm whitespace-pre-wrap leading-relaxed">${e.obs || 'Nenhuma observação cadastrada.'}</div>
                </div>
            `;
            document.getElementById('stock-detail-body').innerHTML = html;
            document.getElementById('overlay-stock').classList.remove('hidden');
        }
        function closeStockModal() { document.getElementById('overlay-stock').classList.add('hidden'); }
        function editStockFromDetail() { closeStockModal(); openForm('estoque', state.currentStockId); }
        function deleteStockFromDetail() {
            showCustomConfirm('Tem certeza que deseja excluir este item do estoque?', () => {
                state.estoque = state.estoque.filter(i => i.id !== state.currentStockId);
                saveState();
                closeStockModal();
                render();
            });
        }

        // --- CONTROLE DE VISUALIZAÇÃO DE PRODUTO ---
        function openProductDetail(id) {
            closeAllModals();
            state.currentProductViewId = id;
            const pr = state.produtos.find(item => item.id === id);
            if (!pr) return;

            let partesHtml = '';
            if (pr.partes && pr.partes.length > 0) {
                partesHtml = pr.partes.map((pt, idx) => pt.material ? `
                    <div class="flex justify-between items-center text-xs bg-stone-50 p-2.5 rounded-xl border border-stone-100 mb-2">
                        <span class="font-medium text-stone-700">Parte ${idx + 1}: ${pt.material}</span>
                        <span class="font-bold text-brand">${pt.peso}g</span>
                    </div>
                ` : '').join('');
            }

            const imgPosClass = getPosClass(pr.imgPos);
            let html = `
                ${pr.img ? `<img src="${pr.img}" class="w-full h-48 rounded-2xl object-cover ${imgPosClass} border border-stone-200 shadow-sm">` : ''}
                <div>
                    <h2 class="text-xl font-bold text-stone-900 mb-1">${pr.nome}</h2>
                    <div class="flex items-center gap-3 mb-4">
                        <span class="text-base font-heading font-bold text-brand">R$ ${Number(pr.preco||0).toFixed(2).replace('.',',')}</span>
                        ${pr.tamanho ? `<span class="text-xs bg-stone-100 text-stone-700 px-2.5 py-1 rounded-lg font-semibold">Tamanho: ${pr.tamanho}</span>` : ''}
                    </div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">Partes e Materiais</h4>
                    <div>${partesHtml || '<p class="text-xs text-stone-400">Nenhuma parte cadastrada.</p>'}</div>
                </div>
            `;
            document.getElementById('product-detail-body').innerHTML = html;
            document.getElementById('overlay-product').classList.remove('hidden');
        }
        function closeProductModal() { document.getElementById('overlay-product').classList.add('hidden'); }
        function editProductFromDetail() { closeProductModal(); openForm('produto', state.currentProductViewId); }
        function deleteProductFromDetail() {
            showCustomConfirm('Tem certeza que deseja excluir este produto? (Isso também o removerá do estoque)', () => {
                const pr = state.produtos.find(i => i.id === state.currentProductViewId);
                if (pr) {
                    state.estoque = state.estoque.filter(e => e.item !== pr.nome);
                }
                state.produtos = state.produtos.filter(i => i.id !== state.currentProductViewId);
                saveState();
                closeProductModal();
                render();
            });
        }

        function closeAllModals() {
            document.getElementById('overlay-form').classList.add('hidden');
            document.getElementById('overlay-recipe').classList.add('hidden');
            document.getElementById('overlay-order').classList.add('hidden');
            document.getElementById('overlay-stock').classList.add('hidden');
            document.getElementById('overlay-product').classList.add('hidden');
            document.getElementById('overlay-confirm').classList.add('hidden');
        }

        function submitForm() {
            const { type, editingId, tempImage, tempImgPos } = state.formState;
            const def = formDefinitions[type];
            let newData = { id: editingId || Date.now(), imgPos: tempImgPos };

            def.fields.forEach(f => {
                if (f.type === 'file') {
                    newData[f.key] = tempImage;
                } else if (f.type === 'imgpos') {
                    newData[f.key] = tempImgPos;
                } else if (f.type === 'checkbox') {
                    newData[f.key] = document.getElementById(f.id).checked;
                } else {
                    let val = document.getElementById(f.id).value;
                    if (f.type === 'number') val = parseFloat(val) || 0;
                    newData[f.key] = val;
                }
            });

            if (type === 'perfil') {
                state.config = { ...state.config, ...newData };
            } else if (type === 'produto') {
                newData.partes = [
                    { material: newData.mat1 || '', peso: newData.pes1 || 0 },
                    { material: newData.mat2 || '', peso: newData.pes2 || 0 },
                    { material: newData.mat3 || '', peso: newData.pes3 || 0 },
                    { material: newData.mat4 || '', peso: newData.pes4 || 0 }
                ];
                delete newData.mat1; delete newData.pes1;
                delete newData.mat2; delete newData.pes2;
                delete newData.mat3; delete newData.pes3;
                delete newData.mat4; delete newData.pes4;

                if (editingId) state.produtos[state.produtos.findIndex(i => i.id === editingId)] = newData;
                else state.produtos.push(newData);
                navigate('produtos');
            } else if (type === 'estoque') {
                if (!newData.qtd || newData.qtd <= 0) {
                    if (editingId) {
                        state.estoque = state.estoque.filter(i => i.id !== editingId);
                    }
                } else {
                    if (editingId) {
                        state.estoque[state.estoque.findIndex(i => i.id === editingId)] = newData;
                    } else {
                        const existingIndex = state.estoque.findIndex(e => e.item === newData.item);
                        if (existingIndex !== -1) {
                            let currentQtd = parseFloat(state.estoque[existingIndex].qtd) || 0;
                            let addedQtd = parseFloat(newData.qtd) || 0;
                            state.estoque[existingIndex].qtd = currentQtd + addedQtd;
                            if (newData.obs) state.estoque[existingIndex].obs = newData.obs;
                            if (newData.img) state.estoque[existingIndex].img = newData.img;
                            if (newData.imgPos) state.estoque[existingIndex].imgPos = newData.imgPos;
                        } else {
                            state.estoque.push(newData);
                        }
                    }
                }
                navigate('estoque');
            } else if (type === 'pedido') {
                if (!newData.qtd || newData.qtd < 1) newData.qtd = 1;
                const prod = state.produtos.find(p => p.nome === newData.item);
                const unitPrice = prod ? Number(prod.preco || 0) : 0;
                newData.valor = unitPrice * newData.qtd;

                if (newData.venderEstoque && newData.qtd > 0) {
                    const stockItem = state.estoque.find(e => e.item === newData.item);
                    if (stockItem) {
                        let atual = parseFloat(stockItem.qtd) || 0;
                        stockItem.qtd = Math.max(0, atual - parseFloat(newData.qtd));
                        if (stockItem.qtd <= 0) {
                            state.estoque = state.estoque.filter(e => e.id !== stockItem.id);
                        }
                    }
                }

                if (editingId) state.pedidos[state.pedidos.findIndex(i => i.id === editingId)] = newData;
                else state.pedidos.push(newData);
                navigate('pedidos');
            } else if (type === 'custo') {
                const custoGrama = newData.precoRolo / newData.pesoRolo;
                newData.custoFio = custoGrama * newData.pesoGasto;
                newData.custoTotal = newData.custoFio + newData.extras + (newData.horas * newData.valorHora);

                if (editingId) state.custos[state.custos.findIndex(i => i.id === editingId)] = newData;
                else state.custos.push(newData);
                navigate('custos');
            } else {
                const targetArray = type === 'financeiro' ? 'financeiro' : type + 's';
                if (editingId) state[targetArray][state[targetArray].findIndex(i => i.id === editingId)] = newData;
                else state[targetArray].push(newData);

                if (!editingId && ['pedido', 'estoque', 'receita', 'financeiro'].includes(type)) {
                    navigate(type === 'estoque' ? 'estoque' : (type === 'financeiro' ? 'financeiro' : type + 's'));
                }
            }

            saveState();
            closeAllModals();
            render();
        }

        function deleteCurrentItem() {
            showCustomConfirm('Tem certeza que deseja excluir este item?', () => {
                const { type, editingId } = state.formState;
                if (type === 'produto') {
                    const pr = state.produtos.find(i => i.id === editingId);
                    if (pr) {
                        state.estoque = state.estoque.filter(e => e.item !== pr.nome);
                    }
                    state.produtos = state.produtos.filter(i => i.id !== editingId);
                } else {
                    const targetArray = type === 'pedido' ? 'pedidos' : (type === 'financeiro' ? 'financeiro' : (type === 'estoque' ? 'estoque' : (type === 'custo' ? 'custos' : (type === 'receita' ? 'receitas' : type + 's'))));
                    state[targetArray] = state[targetArray].filter(i => i.id !== editingId);
                }
                saveState();
                closeAllModals();
                render();
            });
        }

        render();
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
